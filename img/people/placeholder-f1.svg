<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 176" width="460" height="176" role="presentation">
  <rect width="460" height="176" fill="#f0f0f0"/>
  <line x1="0" y1="150" x2="460" y2="150" stroke="#dcdcdc" stroke-width="3"/>

  <!-- ===== front wing: thin plate slung under the nose tip ===== -->
  <path d="M12 129 L68 127 L68 139 L12 141 Z" fill="#c8102e"/>

  <!-- ===== rear wing ===== -->
  <rect x="390" y="102" width="12" height="24" fill="#9c0c23"/>
  <rect x="378" y="78"  width="62" height="11" rx="2" fill="#c8102e"/>
  <rect x="386" y="94"  width="48" height="8"  rx="2" fill="#9c0c23"/>
  <rect x="434" y="74"  width="16" height="42" rx="2" fill="#c8102e"/>
  <text x="442" y="110" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">1</text>

  <!-- ===== body: slim wedge nose into a low tail ===== -->
  <path d="M22 124 Q17 119 26 117 L150 98 L210 89 L268 85 L292 91 L360 99 L406 111 L410 134
           L120 138 L92 132 L30 129 Q21 128 22 124 Z" fill="#e02030"/>
  <!-- sidepod mass -->
  <path d="M204 106 Q192 108 190 124 L190 140 L360 140 Q378 134 374 120 L340 108 Z" fill="#c8102e"/>
  <!-- sidepod intake -->
  <path d="M208 114 L238 116 L230 137 L200 137 Z" fill="#f4f4f4"/>
  <!-- cockpit surround -->
  <path d="M228 89 Q241 80 262 82 L266 92 L230 95 Z" fill="#2b2b2b"/>
  <!-- roll hoop -->
  <path d="M266 83 L279 83 L281 102 L264 102 Z" fill="#9c0c23"/>

  <!-- driver helmet -->
  <circle cx="252" cy="81" r="11" fill="#ffffff"/>
  <path d="M241 78 Q252 66 263 78 Z" fill="#c8102e"/>
  <path d="M242 86 Q252 94 262 86 Z" fill="#c8102e"/>
  <rect x="241" y="78" width="18" height="6" rx="3" fill="#1b1b1b"/>

  <!-- livery -->
  <rect x="300" y="118" width="50" height="3" fill="#ffffff" opacity="0.9"/>
  <rect x="304" y="125" width="46" height="3" fill="#ffffff" opacity="0.9"/>
  <rect x="308" y="132" width="42" height="3" fill="#ffffff" opacity="0.9"/>
  <rect x="276" y="116" width="15" height="19" rx="3" fill="#f2b134"/>

  <!-- ===== wheels ===== -->
  <g>
    <circle cx="152" cy="116" r="34" fill="#1b1b1b"/>
    <circle cx="152" cy="116" r="18" fill="#6b7078"/>
    <circle cx="152" cy="116" r="13" fill="#8b9098"/>
    <circle cx="152" cy="116" r="5"  fill="#3c4048"/>
  </g>
  <g>
    <circle cx="352" cy="114" r="36" fill="#1b1b1b"/>
    <circle cx="352" cy="114" r="19" fill="#6b7078"/>
    <circle cx="352" cy="114" r="14" fill="#8b9098"/>
    <circle cx="352" cy="114" r="5"  fill="#3c4048"/>
  </g>
</svg>
